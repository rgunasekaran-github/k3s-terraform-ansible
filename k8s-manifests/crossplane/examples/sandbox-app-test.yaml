apiVersion: apps/v1
kind: Deployment
metadata:
  name: test-app
  namespace: sandbox-my-first-test-9pcg9
  labels:
    app: test-app
    example: sandbox-validation
spec:
  replicas: 1
  selector:
    matchLabels:
      app: test-app
  template:
    metadata:
      labels:
        app: test-app
    spec:
      containers:
      - name: nginx
        image: nginx:alpine
        resources:
          requests:
            cpu: "100m"
            memory: "128Mi"
          limits:
            cpu: "200m"
            memory: "256Mi"
        ports:
        - containerPort: 80
---
apiVersion: v1
kind: Service
metadata:
  name: test-app
  namespace: sandbox-my-first-test-9pcg9
  labels:
    example: sandbox-validation
spec:
  selector:
    app: test-app
  ports:
  - port: 80
    targetPort: 80
  type: ClusterIP