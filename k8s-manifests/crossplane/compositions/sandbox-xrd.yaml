apiVersion: apiextensions.crossplane.io/v1
kind: CompositeResourceDefinition
metadata:
  name: xsandboxes.platform.example.com
spec:
  group: platform.example.com
  names:
    kind: XSandbox
    plural: xsandboxes
  claimNames:
    kind: Sandbox
    plural: sandboxes
  versions:
  - name: v1alpha1
    served: true
    referenceable: true
    schema:
      openAPIV3Schema:
        type: object
        properties:
          spec:
            type: object
            properties:
              duration:
                type: string
                description: "How long sandbox should exist (e.g., 2h, 24h)"
                pattern: '^[0-9]+[hm]$'
              resourceQuota:
                type: object
                properties:
                  cpu:
                    type: string
                    description: "CPU limit (e.g., 1, 2, 4)"
                    pattern: '^[0-9]+$'
                  memory:
                    type: string
                    description: "Memory limit (e.g., 2Gi, 4Gi, 8Gi)"
                    pattern: '^[0-9]+Gi$'
                required:
                - cpu
                - memory
              isolation:
                type: string
                description: "Network isolation level"
                enum:
                - strict
                - moderate
                - none
                default: strict
            required:
            - duration
            - resourceQuota