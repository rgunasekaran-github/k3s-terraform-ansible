apiVersion: external-secrets.io/v1beta1
kind: ExternalSecret
metadata:
  name: minio-credentials
  namespace: minio
spec:
  refreshInterval: 1h

  secretStoreRef:
    name: openbao-backend
    kind: SecretStore

  target:
    name: minio-credentials
    creationPolicy: Owner

  data:
    - secretKey: MINIO_ROOT_USER
      remoteRef:
        key: secret/minio/credentials
        property: access_key

    - secretKey: MINIO_ROOT_PASSWORD
      remoteRef:
        key: secret/minio/credentials
        property: secret_key