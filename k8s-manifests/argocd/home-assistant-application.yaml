apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: home-assistant
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rgunasekaran-github/k3s-terraform-ansible.git
    targetRevision: ft/deploy-home-assistant
    path: k8s-manifests/home-assistant

  destination:
    server: https://kubernetes.default.svc
    namespace: home-assistant

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true