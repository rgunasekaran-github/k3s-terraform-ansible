apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: openclaw
  namespace: argocd
spec:
  project: default

  source:
    repoURL: https://github.com/rgunasekaran-github/k3s-terraform-ansible.git
    targetRevision: ft/deploy-openclaw
    path: k8s-manifests/openclaw

  destination:
    server: https://kubernetes.default.svc
    namespace: openclaw

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true