  apiVersion: argoproj.io/v1alpha1
  kind: Application
  metadata:
    name: gatekeeper
    namespace: argocd
  spec:
    project: default

    sources:
      - repoURL: https://open-policy-agent.github.io/gatekeeper/charts
        chart: gatekeeper
        targetRevision: 3.22.0
        helm:
          valueFiles:
            - $values/k8s-manifests/gatekeeper/values.yaml

      - repoURL: https://github.com/rgunasekaran-github/k3s-terraform-ansible.git
        targetRevision: main
        ref: values

    destination:
      server: https://kubernetes.default.svc
      namespace: gatekeeper-system

    syncPolicy:
      automated:
        prune: true
        selfHeal: true
      syncOptions:
        - CreateNamespace=true