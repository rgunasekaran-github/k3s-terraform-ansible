apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: external-secrets
  namespace: argocd
spec:
  project: default

  sources:
    # Source 1: Helm chart from External Secrets repo
    - repoURL: https://charts.external-secrets.io
      chart: external-secrets
      targetRevision: 0.9.11
      helm:
        valueFiles:
          - $values/k8s-manifests/external-secrets/values.yaml

    # Source 2: Your Git repo with custom values
    - repoURL: https://github.com/rgunasekaran-github/k3s-terraform-ansible.git
      targetRevision: ft/integrate-openbao-minio-eso
      ref: values

  destination:
    server: https://kubernetes.default.svc
    namespace: external-secrets-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true